<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<!--suppress HtmlRequiredTitleElement -->
<head th:replace="~{fragments/header :: header}"></head>

<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container mt-4">

    <h1>Информация о инциденте</h1>

    <table class="table table-bordered">
        <tbody>
        <tr>
            <th>Номер</th>
            <td th:text="${accident.id}"></td>
        </tr>
        <tr>
            <th>Имя</th>
            <td th:text="${accident.name}"></td>
        </tr>
        <tr>
            <th>Адрес</th>
            <td th:text="${accident.address}"></td>
        </tr>
        <tr>
            <th>Описание</th>
            <td th:text="${accident.text}"></td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex gap-2">

        <a href="/accidents" class="btn btn-secondary">Назад</a>

        <a th:href="@{/accidents/edit/{id}(id=${accident.id})}" class="btn btn-primary">
            Редактировать
        </a>

        <form th:action="@{/accidents/delete/{id}(id=${accident.id})}" method="post">
            <button type="submit" class="btn btn-danger">
                Удалить
            </button>
        </form>

    </div>

</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
